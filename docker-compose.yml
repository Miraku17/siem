services:
  postgres:
    image: postgres:16-alpine
    container_name: siem-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: siem
      POSTGRES_PASSWORD: siem
      POSTGRES_DB: siem
    ports:
      - "5432:5432"
    volumes:
      - siem-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: siem-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  siem-pgdata:
